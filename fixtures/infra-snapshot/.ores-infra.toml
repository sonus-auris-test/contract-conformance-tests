schema_version = 1
layout = "modules"
modules_root = "modules"
environments_root = "environments"

[providers.cloudflare]
canonical_path = "modules/cloudflare"
native_root_directory = "modules/cloudflare"
native_sync = "root-directory"
config_globs = ["wrangler.toml", "wrangler.json", "wrangler.jsonc"]

[providers.supabase]
canonical_path = "modules/supabase"
native_working_directory = "modules"
native_expected_directory = "supabase"
native_sync = "working-directory"

[providers.neon]
canonical_path = "modules/neon"
project_root = "modules/neon"
config = "modules/neon/neon.ts"
native_sync = "project-root"
root_adapter = "optional"
root_adapter_path = "neon.ts"
root_adapter_target = "modules/neon/neon.ts"

[policy]
provider_native_paths_must_match = true
path_filtered_ci = true
state_isolation = "per-provider-per-environment"
secrets = "sops-age"
